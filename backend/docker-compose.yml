services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chess-coach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess_coach
      POSTGRES_PASSWORD: chess_coach_dev
      POSTGRES_DB: chess_coach_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_coach -d chess_coach_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chess-coach-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=chess_coach
      - DB_PASSWORD=chess_coach_dev
      - DB_NAME=chess_coach_dev
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/tmp
    command: sh -c "sqlc generate && swag init -g cmd/server/main.go && air"

  # pgAdmin (Database UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chess-coach-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chesscoach.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
