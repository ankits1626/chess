version: '3.8'

services:
  backend:
    image: golang:1.25-alpine
    container_name: chess-coach-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/chess_coach?sslmode=disable
    volumes:
      - ./backend:/app
      - /app/tmp  # Exclude air build artifacts
    command: |
      sh -c "
        go install github.com/air-verse/air@v1.52.3 &&
        air -c .air.toml
      "
    working_dir: /app
    restart: unless-stopped
    networks:
      - chess-coach-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: chess-coach-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chess_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chess-coach-network

  redis:
    image: redis:7-alpine
    container_name: chess-coach-redis
    ports:
      - "6379:6379"
    networks:
      - chess-coach-network

  nats:
    image: nats:2.10-alpine
    container_name: chess-coach-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: --jetstream --http_port 8222
    networks:
      - chess-coach-network

networks:
  chess-coach-network:
    driver: bridge

volumes:
  postgres_data: